<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>𓏲 ๋࣭ ࣪ ˖ meus favoritos</title>

  <link rel="icon" type="image/png" href="iconn.jfif">

  <style>

    body {
      background-image: url('fundo.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      font-family: 'Lobster', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .quadro {
      background-color: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(5px);

      padding: 40px;
      width: 90%;
      max-width: 1000px;
      text-align: center;

      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(255, 192, 235, 0.4);
    }

    h1 {
      color: pink;
      margin-bottom: 10px;
    }

    p {
      color: #333;
    }

    .categoria {
      margin-top: 50px;
    }

    .categoria h2 {
      color: #ff9fd6;
      margin-bottom: 20px;
      font-size: 28px;
    }

    .card {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 20px;
      justify-items: center;
    }

    .filme {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }

    .filme img {
      width: 120px;
      height: 180px;
      object-fit: cover;

      border-radius: 6px;

      filter: grayscale(100%);
      transition: transform 0.3s ease, filter 0.5s ease;
    }

    .filme:hover img {
      transform: scale(1.05);
      filter: grayscale(0%);
    }

    .nome {
      position: absolute;
      bottom: 0;
      width: 100%;

      background: rgba(0,0,0,0.7);
      color: white;

      font-size: 13px;
      padding: 5px;

      opacity: 0;
      transition: 0.3s;
    }

    .filme:hover .nome {
      opacity: 1;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;

      background-color: #ffc0eb;
      color: #000;

      text-decoration: none;
      border-radius: 20px;

      font-weight: bold;
      transition: all 0.3s ease;

      margin-top: 30px;
    }

    .btn:hover {
      background-color: #ff9fd6;
      transform: scale(1.05);
    }

  </style>
</head>

<body>

  <div class="quadro">

    <h1>𓏲 ๋࣭ ࣪ ˖ meus favoritos</h1>
    <p>filmes, séries e desenhos que eu gosto ♡</p>

    <!-- FILMES -->
    <div class="categoria">

      <h2>🎬 Filmes</h2>

      <div class="card">

        <div class="filme">
          <img src="coraline.jpg" alt="Coraline">
          <div class="nome">Coraline</div>
        </div>

        <div class="filme">
          <img src="perfectblue.jpg" alt="Perfect Blue">
          <div class="nome">Perfect Blue</div>
        </div>

        <div class="filme">
          <img src="kamikaze.jpg" alt="Kamikaze Girls">
          <div class="nome">Kamikaze Girls</div>
        </div>

        <div class="filme">
          <img src="500dias.jpg" alt="500 Dias com Ela">
          <div class="nome">500 Dias com Ela</div>
        </div>

      </div>
    </div>

    <!-- SÉRIES -->
    <div class="categoria">

      <h2>📺 Séries</h2>

      <div class="card">

        <div class="filme">
          <img src="supernatural.jpg" alt="Supernatural">
          <div class="nome">Supernatural</div>
        </div>

        <div class="filme">
          <img src="anne.jpg" alt="Anne With An E">
          <div class="nome">Anne With An E</div>
        </div>

      </div>
    </div>

    <!-- DESENHOS -->
    <div class="categoria">

      <h2>🧸 Desenhos</h2>

      <div class="card">

        <div class="filme">
          <img src="gravityfalls.jpg" alt="Gravity Falls">
          <div class="nome">Gravity Falls</div>
        </div>

        <div class="filme">
          <img src="horaaventura.jpg" alt="Hora de Aventura">
          <div class="nome">Hora de Aventura</div>
        </div>

      </div>
    </div>

    <p>Em andamento...</p>

    <a href="index.html" class="btn">
      Voltar para Home
    </a>

  </div>

</body>
</html>
